# ---- 数据源：SQLite ----
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${user.dir}/data/downtime.db
quarkus.datasource.jdbc.max-size=1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# ---- HTTP ----
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# 前端构建产物在打包前拷入 src/main/resources/META-INF/resources，由 Quarkus 直接托管

# 班次配置：早班 08:00-20:00，夜班 20:00-次日08:00
downtime.shift.day-start=08:00
downtime.shift.night-start=20:00

# 测试环境使用内存库
%test.quarkus.datasource.jdbc.url=jdbc:sqlite::memory:
%test.quarkus.hibernate-orm.database.generation=drop-and-create
