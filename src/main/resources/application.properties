quarkus.http.port=8080
quarkus.http.enable-compression=true

# ---- CORS ----
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# ---- 演示数据(空库时自动播种) ----
app.demo-seed=true

# ---- SQLite 数据源 ----
# SQLite 仅支持单写者,连接池必须固定为 1,否则并发连接会 SQLITE_BUSY
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/downtime.db
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update

# ---- 业务参数 ----
app.zone=Asia/Shanghai
# 班次定义(跨零点班次用结束时间小于开始时间表示)
app.shifts=早班=08:00-20:00,夜班=20:00-08:00

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/test-downtime.db
